<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel | CD Horizonte</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f2f5f9}.wrap{max-width:1200px;margin:3vh auto}.hidden{display:none}.thumb{width:76px;height:58px;object-fit:cover}.nav-pills .nav-link{cursor:pointer}</style></head><body><main class="container wrap"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3">CD Horizonte · Painel de gestão</h1><p class="text-secondary">Conteúdos do site geridos pelo administrador</p><section id="login"><form id="loginForm" class="row g-3" style="max-width:500px"><div class="col-12"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required autocomplete="username"></div><div class="col-12"><label class="form-label">Palavra-passe</label><input class="form-control" type="password" name="password" required autocomplete="current-password"></div><div class="col-12"><button class="btn btn-primary">Entrar</button></div></form></section><section id="dashboard" class="hidden"><div class="d-flex justify-content-between align-items-center mb-3"><span>Olá, <b id="adminName"></b></span><button id="logout" class="btn btn-outline-secondary btn-sm">Terminar sessão</button></div><div id="alert"></div><ul class="nav nav-pills flex-wrap gap-2 mb-4" id="tabs"><li><button class="nav-link active" data-tab="matches">Jogos</button></li><li><button class="nav-link" data-tab="gallery">Galeria</button></li><li><button class="nav-link" data-tab="players">Plantel</button></li><li><button class="nav-link" data-tab="news">Notícias</button></li><li><button class="nav-link" data-tab="products">Loja</button></li><li><button class="nav-link" data-tab="memberships">Sócios</button></li><li><button class="nav-link" data-tab="messages">Mensagens</button></li></ul><div id="workspace"></div></section></div></div></main><script>
const $=s=>document.querySelector(s);let current='matches';const config={matches:{title:'Jogos',fields:[['opponent','Adversário','text'],['competition','Competição','text'],['match_date','Data e hora','datetime-local'],['venue','Estádio','text'],['home_score','Golos CDH','number'],['away_score','Golos adversário','number'],['status','Estado','select','scheduled|Agendado,live|A decorrer,half_time|Intervalo,finished|Terminado,postponed|Adiado']],cols:['opponent','match_date','status']},players:{title:'Plantel',fields:[['full_name','Nome completo','text'],['position','Posição','text'],['shirt_number','Número','number'],['bio','Biografia','textarea'],['active','Ativo','select','1|Sim,0|Não']],cols:['full_name','position','shirt_number']},news:{title:'Notícias',fields:[['title','Título','text'],['slug','Slug URL','text'],['summary','Resumo','textarea'],['body','Texto','textarea'],['published','Publicado','select','1|Sim,0|Não']],cols:['title','published']},products:{title:'Produtos',fields:[['name','Nome','text'],['description','Descrição','textarea'],['price','Preço (AOA)','number'],['stock','Stock','number'],['active','Ativo','select','1|Sim,0|Não']],cols:['name','price','stock']},gallery:{title:'Galeria',fields:[['title','Título','text']],cols:['title','image_path']},memberships:{title:'Inscrições de sócios',cols:['full_name','email','phone','status','created_at']},messages:{title:'Mensagens recebidas',cols:['name','email','subject','message','created_at']}};
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Pedido falhou');return d}function esc(v=''){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function alertMsg(s,kind='success'){$('#alert').innerHTML=`<div class="alert alert-${kind}">${esc(s)}</div>`}
async function boot(){try{const d=await api('/api/auth/me');if(!d.admin)return;$('#login').classList.add('hidden');$('#dashboard').classList.remove('hidden');$('#adminName').textContent=d.admin.name;await render() }catch{}}
function formField(f){let [name,label,type,opts]=f;let value='';if(['photo_path','image_path'].includes(name))return `<div class="col-md-6"><label class="form-label">${label} (imagem)</label><input class="form-control" name="${name}_file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div>`;if(type==='select')return `<div class="col-md-6"><label class="form-label">${label}</label><select class="form-select" name="${name}">${opts.split(',').map(o=>{let [v,t]=o.split('|');return `<option value="${v}">${t}</option>`}).join('')}</select></div>`;if(type==='textarea')return `<div class="col-12"><label class="form-label">${label}</label><textarea class="form-control" name="${name}" rows="3"></textarea></div>`;return `<div class="col-md-6"><label class="form-label">${label}</label><input class="form-control" name="${name}" type="${type}" ${type==='number'?'step="any"':''}></div>`}
async function render(){const c=config[current],data=await api('/api/admin/'+current);let form='';if(c.fields){form=`<div class="card mb-4"><div class="card-body"><h2 class="h5">Adicionar ${c.title.toLowerCase()}</h2><form id="itemForm" class="row g-3">${c.fields.map(formField).join('')}${current==='gallery'?'<div class="col-md-6"><label class="form-label">Fotografia</label><input class="form-control" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required></div>':''}<div class="col-12"><button class="btn btn-primary">Guardar</button></div></form></div></div>`}
let rows=data.map(item=>`<tr>${c.cols.map(k=>`<td>${k==='image_path'?`<img class="thumb" src="${esc(item[k])}" alt="">`:esc(k==='match_date'&&item[k]?new Date(item[k]).toLocaleString('pt-PT'):item[k])}</td>`).join('')}<td>${current==='memberships'?`<select class="form-select form-select-sm" data-status="${item.id}"><option value="pending" ${item.status==='pending'?'selected':''}>Pendente</option><option value="approved" ${item.status==='approved'?'selected':''}>Aprovado</option><option value="rejected" ${item.status==='rejected'?'selected':''}>Rejeitado</option></select>`:current==='messages'?`<button class="btn btn-sm btn-outline-secondary" data-read="${item.id}">Marcar lida</button>`:`<button class="btn btn-sm btn-outline-danger" data-del="${item.id}">Eliminar</button>`}</td></tr>`).join('');$('#workspace').innerHTML=form+`<h2 class="h5">${c.title} registados</h2><div class="table-responsive"><table class="table table-striped table-sm"><thead><tr>${c.cols.map(k=>`<th>${esc(k)}</th>`).join('')}<th>Ações</th></tr></thead><tbody>${rows||`<tr><td colspan="${c.cols.length+1}" class="text-secondary">Sem registos.</td></tr>`}</tbody></table></div>`;
const f=$('#itemForm');if(f)f.onsubmit=async e=>{e.preventDefault();try{const fd=new FormData(f),body={};for(const [k,v] of fd.entries())if(!k.endsWith('_file')&&k!=='image'&&v!=='')body[k]=v;for(const key of ['photo_path','image_path']){const file=fd.get(key+'_file');if(file&&file.size){const up=new FormData();up.append('image',file);const result=await api('/api/admin/upload',{method:'POST',body:up});body[key]=result.path}}if(current==='gallery'){const file=fd.get('image'),up=new FormData();up.append('image',file);const result=await api('/api/admin/upload',{method:'POST',body:up});body.image_path=result.path}await api('/api/admin/'+current,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});alertMsg('Conteúdo guardado com sucesso.');await render()}catch(err){alertMsg(err.message,'danger')}}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await boot()}catch(err){alertMsg(err.message,'danger')}};$('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.reload()};$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;current=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render().catch(err=>alertMsg(err.message,'danger'))};$('#workspace').onclick=async e=>{const d=e.target.closest('[data-del]'),r=e.target.closest('[data-read]');try{if(d&&confirm('Eliminar este registo?')){await api('/api/admin/'+current+'/'+d.dataset.del,{method:'DELETE'});await render()}if(r){await api('/api/admin/messages/'+r.dataset.read+'/read',{method:'PATCH'});await render()}}catch(err){alertMsg(err.message,'danger')}};$('#workspace').onchange=async e=>{const s=e.target.closest('[data-status]');if(!s)return;try{await api('/api/admin/memberships/'+s.dataset.status,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s.value})});alertMsg('Estado atualizado.')}catch(err){alertMsg(err.message,'danger')}};boot();
</script></body></html>
