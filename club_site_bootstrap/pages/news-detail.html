<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notícia | CD Horizonte</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/assets/css/style.css"></head><body><main class="container py-5" id="article"><a href="/pages/news.html">← Voltar às notícias</a><p class="mt-4">A carregar notícia…</p></main><script>const slug=new URLSearchParams(location.search).get('slug');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/public/news/'+encodeURIComponent(slug||'')).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);document.querySelector('#article').innerHTML=`<a href="/pages/news.html">← Voltar às notícias</a><article class="mt-4"><h1>${esc(d.title)}</h1>${d.image_path?`<img class="img-fluid rounded my-3" src="${esc(d.image_path)}" alt="${esc(d.title)}">`:''}<p class="lead">${esc(d.summary)}</p><div>${esc(d.body).replace(/\n/g,'<br>')}</div></article>`}).catch(e=>document.querySelector('#article').innerHTML=`<p>${esc(e.message)}</p><a href="/pages/news.html">Voltar</a>`)</script></body></html>
